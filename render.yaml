services:
  - type: web
    name: redirect-preflight-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @nex2i/api
    startCommand: npm run start --workspace @nex2i/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://redirect-preflight.nex2i.com
      - key: CORS_ORIGIN
        value: https://redirect-preflight.nex2i.com
      - key: COOKIE_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
